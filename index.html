<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradie Dialer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2/dist/twilio.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📞 Tradie Dialer</h1>
      <p class="subtitle">Cold Call Australian Tradies</p>
      <div class="connection-status">
        <span class="status-indicator" id="connectionIndicator"></span>
        <span id="connectionText">Ready</span>
      </div>
    </div>
    <div class="dialer">
      <div class="form-group">
        <label for="phoneInput">Recipient Phone Number</label>
        <input
          type="tel"
          id="phoneInput"
          class="phone-input"
          placeholder="+614XXXXXXXX"
          maxlength="13"
          autocomplete="off"
        />
        <div class="format-hint">Format: +61 followed by 9 digits</div>
      </div>
      <div class="button-group">
        <button id="callBtn" class="btn btn-call">
          <span class="btn-icon">📞</span>
          <span class="btn-text">Call</span>
        </button>
        <button id="hangupBtn" class="btn btn-hangup" disabled>
          <span class="btn-icon">📵</span>
          <span class="btn-text">Hang Up</span>
        </button>
      </div>
      <div id="status" class="status-message" style="display: none;">
        <span id="statusText"></span>
      </div>
      <div class="call-info" id="callInfo" style="display: none;">
        <div class="info-row">
          <span class="info-label">Caller ID:</span>
          <span class="info-value" id="callerId">+61468161378</span>
        </div>
        <div class="info-row">
          <span class="info-label">Recipient:</span>
          <span class="info-value" id="recipientNumber">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Status:</span>
          <span class="info-value" id="callStatus">Connecting...</span>
        </div>
      </div>
    </div>
    <div class="logs">
      <h3>Console Logs</h3>
      <div id="logContainer" class="log-container"></div>
    </div>
    <div class="footer">
      <p>Vapi Outbound • E.164 Format • Australian Numbers Only</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
